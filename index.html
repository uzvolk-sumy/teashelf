<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Чайна полиця</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Чайна полиця">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eef2ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121614" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: celadon porcelain shelf — tea grid on the left, the open tea on the right (iPad), full-screen brewing timer on top. */
:root {
  --bg: #eef2ef;
  --surface: #ffffff;
  --surface-2: #e3eae5;
  --ink: #18201c;
  --muted: #5d6b64;
  --line: #cfd9d2;
  --accent: #3f7663;      /* celadon glaze */
  --accent-ink: #ffffff;
  --liquor: #b5651d;      /* tea liquor amber */
  --liquor-soft: #f3dfc8;
  --danger: #a23b2c;
  --star: #c48a1a;
  --shen: #5c8f3e; --shu: #6e4630; --yancha: #c06a2b; --anxi: #b59a22;
  --red: #a8392f; --blend: #b9577e; --white: #8f9a94; --green: #3d7f9e; --other: #7a857f;
  --shadow: 0 1px 2px rgb(24 32 28 / .06), 0 4px 14px rgb(24 32 28 / .06);
  --f-display: "Unbounded", "Manrope", system-ui, sans-serif;
  --f-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121614; --surface: #1b211e; --surface-2: #232b27; --ink: #e6ece8; --muted: #9aa8a0; --line: #2f3933;
  --accent: #7fbfa6; --accent-ink: #0f1512; --liquor: #e39a52; --liquor-soft: #3a2a1b; --danger: #e07a6a; --star: #e2b04a;
  --shen: #8cc26a; --shu: #b88a6c; --yancha: #e39256; --anxi: #d9c25a; --red: #e07a6a; --blend: #e28fb2; --white: #b4beb8; --green: #74b6d3; --other: #9aa8a0;
  --shadow: 0 1px 2px rgb(0 0 0 / .3); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #121614; --surface: #1b211e; --surface-2: #232b27; --ink: #e6ece8; --muted: #9aa8a0; --line: #2f3933;
  --accent: #7fbfa6; --accent-ink: #0f1512; --liquor: #e39a52; --liquor-soft: #3a2a1b; --danger: #e07a6a; --star: #e2b04a;
  --shen: #8cc26a; --shu: #b88a6c; --yancha: #e39256; --anxi: #d9c25a; --red: #e07a6a; --blend: #e28fb2; --white: #b4beb8; --green: #74b6d3; --other: #9aa8a0;
  --shadow: 0 1px 2px rgb(0 0 0 / .3); color-scheme: dark;
}
* { box-sizing: border-box; }
html { color-scheme: light dark; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html, body { height: 100%; margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
button, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1280px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 40px; }

/* header */
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.brand h1 { font-family: var(--f-display); font-weight: 600; font-size: clamp(22px, 3.2vw, 30px); letter-spacing: -.01em; margin: 0; text-wrap: balance; }
.brand p { margin: 2px 0 0; color: var(--muted); }
.sync { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
.iconbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: 14px; }
.iconbtn:disabled { opacity: .5; }
.tabs { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 4px; gap: 2px; margin-bottom: 16px; }
.tabs button { border: 0; background: transparent; padding: 8px 18px; border-radius: 999px; font-weight: 600; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

/* banner */
.banner { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 14px 16px; margin-bottom: 16px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.banner.warn { border-color: color-mix(in srgb, var(--liquor) 45%, var(--line)); background: var(--liquor-soft); }
.banner p { margin: 0; min-width: 0; flex: 1 1 260px; }
.btn { border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 700; border-radius: 12px; padding: 11px 18px; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
a.btn { text-decoration: none; text-align: center; }
.btn.liquor { background: var(--liquor); color: #fff; }
.btn:disabled { opacity: .5; cursor: default; }

/* advice */
.advice { margin-bottom: 18px; }
.eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; margin: 0 0 8px; }
.advice-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.pick { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 14px; display: grid; gap: 4px; min-width: 0; }
.pick[aria-current="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.pick .why { color: var(--muted); font-size: 13px; }
.pick { gap: 12px; align-content: space-between; }
.pick-open { all: unset; display: grid; gap: 4px; cursor: pointer; min-width: 0; }
.pick-open:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 8px; }

/* layout */
.layout { display: grid; gap: 20px; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.card { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 14px; display: grid; gap: 8px; align-content: start; min-width: 0; position: relative; }
.card[aria-current="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.card.out { opacity: .62; }
.cat { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); font-weight: 600; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--other)); flex: none; }
.name { font-weight: 700; font-size: 15px; line-height: 1.3; overflow-wrap: anywhere; }
.name small { display: block; font-weight: 500; color: var(--muted); font-size: 13px; }
.meta { display: flex; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stars { color: var(--star); letter-spacing: 1px; font-size: 13px; }
.pill { font-size: 11px; font-weight: 700; border-radius: 999px; padding: 2px 8px; background: var(--surface-2); color: var(--muted); justify-self: start; }
.pill.want { background: var(--liquor-soft); color: var(--liquor); }
.pill.now { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
.empty { color: var(--muted); padding: 24px; text-align: center; border: 1px dashed var(--line); border-radius: var(--r); }

/* detail. Narrow screens: a full-screen reading sheet. iPad width: app header stays put,
   the shelf and the open tea scroll in two panes that start at the same line. */
.detail-host { background: var(--bg); min-width: 0; }
.detail-head { position: sticky; top: 0; z-index: 2; background: var(--bg); padding-block: 12px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 4px; }
.detail-head .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.detail-head .back { border: 0; background: none; color: var(--accent); font-weight: 700; font-size: 17px; padding: 4px 0; }
.detail-placeholder { color: var(--muted); padding: 32px 8px; text-align: center; }
@media (max-width: 899px) {
  html.sheet-open, html.sheet-open body { overflow: hidden; }
  .detail-host { position: fixed; inset: 0; z-index: 30; overflow-y: auto; overscroll-behavior: contain;
    padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 24px) max(16px, env(safe-area-inset-left, 0px)); }
  .detail-head, .detail { max-width: 760px; margin-inline: auto; }
  .detail-host[data-empty] { display: none; }
}
@media (min-width: 900px) {
  html, body { overflow: hidden; }
  .wrap { height: 100%; display: flex; flex-direction: column; padding-block: 16px 0; }
  .top, #banner, .tabs { flex: none; }
  .tabs { align-self: flex-start; }
  .detail-head .row:first-child { display: none; }
  #view-shelf, #view-journal { flex: 1 1 auto; min-height: 0; }
  #view-journal { overflow-y: auto; padding-bottom: 32px; }
  #view-shelf .layout { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) minmax(380px, 42%); gap: 24px; align-items: stretch; }
  .list-pane, .detail-host { height: 100%; overflow-y: auto; overscroll-behavior: contain; padding-bottom: 32px; }
  .list-pane { padding-right: 4px; }
  .detail-host { border-left: 1px solid var(--line); padding-left: 24px; }
  .detail-head .back { display: none; }
  .detail-head { padding-top: 0; }
}
.detail { display: grid; gap: 22px; padding-top: 18px; min-width: 0; font-size: 17px; line-height: 1.55; }
.detail-head h2 { font-family: var(--f-display); font-weight: 600; font-size: clamp(22px, 2.6vw, 30px); line-height: 1.2; margin: 2px 0 0; text-wrap: balance; overflow-wrap: anywhere; }
.detail-head .sub, .detail .sub { color: var(--muted); margin: 0; font-size: 15px; }
.detail-head .cat { font-size: 14px; }
.detail .actions .btn { font-size: 17px; padding-block: 14px; }
.params { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.param { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; min-width: 0; font-size: 17px; }
.param b { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 4px; }
.param.wide { grid-column: 1 / -1; }
.block { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; display: grid; gap: 14px; }
.prose { margin: 0; overflow-wrap: anywhere; }
.section-title { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; margin: 0 0 6px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.actions .btn { flex: 1 1 auto; }
.rate { display: flex; gap: 4px; }
.rate button { border: 0; background: none; font-size: 28px; line-height: 1; color: var(--line); padding: 2px; }
.rate button.on { color: var(--star); }
.seg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 11px 8px; font-weight: 600; font-size: 15px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
textarea { width: 100%; min-height: 84px; resize: vertical; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--surface); }
.hist { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.hist li { display: flex; gap: 12px; font-size: 15px; color: var(--muted); }
.hist time { font-variant-numeric: tabular-nums; flex: none; width: 96px; color: var(--ink); }

/* journal */
.month h3 { font-family: var(--f-display); font-weight: 400; font-size: 17px; margin: 18px 0 8px; }
.entries { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.entry { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 4px 12px; }
.entry time { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
.entry .what { font-weight: 600; overflow-wrap: anywhere; }
.entry .note { grid-column: 2; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }

/* timer */
.overlay { position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow: auto; display: grid; place-items: center; padding: calc(env(safe-area-inset-top, 0px) + 16px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 16px) max(16px, env(safe-area-inset-left, 0px)); }
.timer { width: min(520px, 100%); display: grid; gap: 18px; justify-items: center; text-align: center; }
.timer h2 { font-family: var(--f-display); font-weight: 600; font-size: 20px; margin: 0; text-wrap: balance; }
.timer .hint { color: var(--muted); margin: 0; }
.ring { position: relative; width: min(320px, 78vw); aspect-ratio: 1; max-width: 100%; border: 0; background: none; padding: 0; border-radius: 50%; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .track { fill: none; stroke: var(--surface-2); stroke-width: 14; }
.ring .prog { fill: none; stroke: var(--liquor); stroke-width: 14; stroke-linecap: round; transition: stroke-dashoffset .25s linear; }
.ring .liq { fill: var(--liquor-soft); }
.ring .center { position: absolute; inset: 0; display: grid; place-content: center; gap: 4px; }
.ring .secs { font-family: var(--f-display); font-weight: 600; font-size: clamp(54px, 15vw, 84px); font-variant-numeric: tabular-nums; line-height: 1; }
.ring .lbl { color: var(--muted); font-weight: 600; }
.ring.done .secs { color: var(--liquor); }
.stepper { display: flex; gap: 10px; align-items: center; }
.stepper button { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
.phase { font-weight: 700; font-size: 15px; }
.tbar { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; width: 100%; }
.tbar .btn { flex: 1 1 160px; padding-block: 14px; font-size: 16px; }

/* sheet + toast */
.sheet { width: min(480px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px; display: grid; gap: 14px; }
.sheet h2 { font-family: var(--f-display); font-weight: 600; font-size: 19px; margin: 0; }
.setup { width: min(520px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px; display: grid; gap: 14px; }
.setup h2 { font-family: var(--f-display); font-weight: 600; font-size: 20px; margin: 0; }
.setup label { display: grid; gap: 6px; font-weight: 600; font-size: 14px; }
.setup input { border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; background: var(--surface); min-width: 0; width: 100%; }
.setup p { margin: 0; color: var(--muted); }
.setup .err { color: var(--danger); font-weight: 600; }
.iconbtn.add { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.addform { width: min(720px, 100%); align-self: start; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px; display: grid; gap: 18px; }
.addform h2 { font-family: var(--f-display); font-weight: 600; font-size: 22px; margin: 0; }
.addform fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 12px; min-width: 0; }
.addform legend { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; margin-bottom: 10px; padding: 0; }
.fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.addform label { display: grid; gap: 6px; font-weight: 600; font-size: 14px; min-width: 0; }
.addform label.wide { grid-column: 1 / -1; }
.addform input, .addform select { border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; background: var(--surface); min-width: 0; width: 100%; font-size: 16px; }
.addform textarea { font-size: 16px; min-height: 72px; }
.addform .hint { font-weight: 500; color: var(--muted); font-size: 12px; }
.addform .err { color: var(--danger); font-weight: 600; margin: 0; }
.whenpick { display: flex; gap: 6px; flex-wrap: wrap; }
.whenpick button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-weight: 600; }
.whenpick button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); z-index: 60; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; max-width: calc(100% - 32px); box-shadow: var(--shadow); }
@media (prefers-reduced-motion: reduce) { .ring .prog { transition: none; } }
</style>
</head>
<body>

<div class="wrap" id="app">
  <header class="top">
    <div class="brand">
      <h1>Чайна полиця</h1>
      <p id="daypart">Завантажую полицю…</p>
    </div>
    <div class="sync">
      <span id="syncText"></span>
      <button class="iconbtn add" id="addBtn" type="button">+ Чай</button>
      <button class="iconbtn" id="refresh" type="button">Оновити</button>
      <button class="iconbtn" id="settingsBtn" type="button" aria-label="Підключення">⚙︎</button>
    </div>
  </header>

  <div id="banner" hidden></div>

  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tab-shelf" aria-selected="true" data-tab="shelf">Полиця</button>
    <button type="button" role="tab" id="tab-journal" aria-selected="false" data-tab="journal">Журнал</button>
  </div>

  <section id="view-shelf">
    <div class="layout">
      <div class="list-pane" id="listPane">
        <div class="advice" id="advice"></div>
        <div class="filters" id="filters"></div>
        <div class="grid" id="grid"><div class="empty">Чаї з «Чайного журналу» в Notion з'являться тут.</div></div>
      </div>
      <div class="detail-host" id="detailHost" hidden></div>
    </div>
  </section>

  <section id="view-journal" hidden>
    <div id="journal"><div class="empty">Тут буде історія чаювань із бази «Чаювання».</div></div>
  </section>
</div>

<div class="overlay" id="timerHost" hidden></div>
<div class="overlay" id="sheetHost" hidden></div>
<div class="overlay" id="setupHost" hidden></div>
<div class="overlay" id="addHost" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
  "use strict";
  const APP_VERSION = "6";
  const CACHE_KEY = "teashelf.snapshot.v1";
  const CONFIG_KEY = "teashelf.config.v1";
  const QUEUE_KEY = "teashelf.queue.v1";
  const IN_STOCK = ["В колекції", "Заварюю зараз"];
  const STATUSES = ["В колекції", "Заварюю зараз", "Випито", "Хочу ще"];
  const CAT_COLOR = {
    "Шен пуер": "--shen", "Шу пуер": "--shu", "Улун утесний (яньча)": "--yancha", "Улун аньсійський": "--anxi",
    "Червоний чай": "--red", "Ароматизований / купаж": "--blend", "Білий": "--white", "Зелений": "--green",
  };
  const DAYPARTS = [
    { key: "вранці", title: "Ранок", setting: "Ранок: початок, год", def: 5 },
    { key: "вдень", title: "День", setting: "День: початок, год", def: 11 },
    { key: "після обіду", title: "Після обіду", setting: "Після обіду: початок, год", def: 14 },
    { key: "ввечері", title: "Вечір", setting: "Вечір: початок, год", def: 17 },
  ];
  const MONTHS = ["Січень","Лютий","Березень","Квітень","Травень","Червень","Липень","Серпень","Вересень","Жовтень","Листопад","Грудень"];
  const MONTHS_GEN = ["січня","лютого","березня","квітня","травня","червня","липня","серпня","вересня","жовтня","листопада","грудня"];

  const state = { teas: [], log: [], settings: {}, selected: null, tab: "shelf", filter: "in", loading: false, loadedAt: 0, fromCache: false, queue: [] };
  const store = {
    get(k, def) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch { return def; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // ---------- helpers
  const pid = (u) => { const m = String(u || "").replace(/-/g, "").match(/[0-9a-f]{32}/i); return m ? m[0].toLowerCase() : ""; };
  const arr = (v) => { if (Array.isArray(v)) return v; try { const a = JSON.parse(v || "[]"); return Array.isArray(a) ? a : []; } catch { return []; } };
  const pad = (n) => String(n).padStart(2, "0");

  const nowHM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const daysSince = (iso) => { if (!iso) return null; const a = new Date(iso.slice(0, 10) + "T00:00:00"); const b = new Date(todayISO() + "T00:00:00"); return Math.round((b - a) / 864e5); };
  const ago = (iso) => { const d = daysSince(iso); if (d == null) return ""; if (d <= 0) return "сьогодні"; if (d === 1) return "учора"; if (d < 7) return `${d} дн. тому`; if (d < 30) return `${Math.round(d / 7)} тиж. тому`; return `${Math.round(d / 30)} міс. тому`; };

  const shortName = (n) => String(n || "").split(" (")[0];

  const catVar = (c) => `var(${CAT_COLOR[c] || "--other"})`;
  const nameParts = (n) => { const m = String(n || "").match(/^(.*?)\s*(\(.*\))\s*(.*)$/); return m ? { main: (m[1] + (m[3] ? " " + m[3] : "")).trim(), sub: m[2] } : { main: n, sub: "" }; };

  // ---------- parse brewing params
  function steepPlan(t) {
    const s = (t.steeps || "").toLowerCase();
    let list = null;
    const lm = s.match(/(\d+(?:\s*\/\s*\d+)+)\s*с/);
    if (lm) list = lm[1].split("/").map((x) => +x.trim());
    const m = s.match(/(\d+)(?:\s*[–-]\s*(\d+))?\s*(хв|с)/);
    const def = /шу/i.test(t.cat) ? 10 : /червоний|ароматиз/i.test(t.cat) ? 15 : 10;
    const first = list ? list[0] : m ? +m[1] * (m[3] === "хв" ? 60 : 1) : def;
    const st = s.match(/\+\s*(\d+)(?:\s*[–-]\s*\d+)?\s*(хв|с)/);

    const cm = String(t.count || "").match(/(\d+)(?:\s*[–-]\s*(\d+))?/);
    const max = cm ? +(cm[2] || cm[1]) : 8;
    return { list, first, step, max };
  }
  function steepSeconds(plan, i) {
    if (plan.list && i <= plan.list.length) return plan.list[i - 1];
    const base = plan.list ? plan.list[plan.list.length - 1] : plan.first;
    const k = plan.list ? i - plan.list.length : i - 1;
    return Math.max(3, base + plan.step * k);
  }
  function rinsePlan(t) {
    const s = (t.rinse || "").toLowerCase();

    const m = s.match(/(\d+)(?:\s*[–-]\s*\d+)?\s*с/);

  }

  // ---------- data mapping
  const teaFrom = (r) => ({
    id: pid(r.id || r.url), url: r.url || "", name: r["Назва"] || "Без назви", cat: r["Категорія"] || "", format: r["Формат"] || "",
    region: r["Регіон"] || "", brand: r["Бренд / виробник"] || "", profile: r["Очікуваний профіль"] || "",
    impressions: r["Враження"] || "", brewText: r["Заварювання"] || "", dose: r["Скільки класти"] || "", ratio: r["Пропорція"] || "",
    water: r["Вода"] || "", rinse: r["Промивка"] || "", steeps: r["Проливи"] || "", count: r["Кількість проливів"] || "",
    tip: r["Порада"] || "", when: arr(r["Коли пити"]), link: r["Посилання"] || "", status: r["Статус"] || "",

  });

  function brewStats(teaId) {
    const brews = state.log.filter((e) => e.teaId === teaId && e.action === "заварив");
    const t = state.teas.find((x) => x.id === teaId);
    const dates = brews.map((e) => e.date).concat(t && t.tasted ? [t.tasted] : []).filter(Boolean).sort();
    return { count: brews.length, last: dates[dates.length - 1] || "" };
  }

  // ---------- daypart + advisor
  function hourSetting(name, def) { const v = parseInt(state.settings[name], 10); return Number.isFinite(v) ? v : def; }
  function currentDaypart() {
    const h = new Date().getHours();
    const starts = DAYPARTS.map((d) => hourSetting(d.setting, d.def));
    const end = hourSetting("Вечір: кінець, год", 21);
    if (h < starts[0] || h >= end) return { key: "ввечері", title: "Ніч", night: true };
    let idx = 0;
    starts.forEach((s, i) => { if (h >= s) idx = i; });
    return DAYPARTS[idx];

  function defaultWhen(cat) {
    if (/шен|улун|білий|зелений/i.test(cat)) return ["вдень", "після обіду"];
    if (/ароматиз/i.test(cat)) return ["після обіду", "ввечері"];
    return ["вранці", "вдень", "після обіду", "ввечері"];
  }
  function advise() {
    const dp = currentDaypart();
    return state.teas.filter((t) => IN_STOCK.includes(t.status)).map((t) => {
      const when = t.when.length ? t.when : defaultWhen(t.cat);
      const st = brewStats(t.id);
      const d = daysSince(st.last);
      let score = 0; const why = [];
      if (when.includes(dp.key)) { score += 40; why.push(dp.night ? "м'який на ніч" : `пасує: ${dp.key}`); }
      if (dp.night && /шен|улун|червоний/i.test(t.cat)) score -= 30;
      if (t.status === "Заварюю зараз") { score += 15; why.push("уже відкритий"); }
      if (t.stars >= 4) { score += 10; why.push(starsView(t.stars)); }
      if (t.stars && t.stars <= 2) score -= 25;
      if (d === 0) { score -= 30; why.push("сьогодні вже був"); }
      else if (d == null) { score += 12; why.push("ще не пробував"); }
      else { score += Math.min(d, 14); why.push(`востаннє ${ago(st.last)}`); }

  }

  // ---------- bridge (Google Apps Script → Notion)
  const config = () => store.get(CONFIG_KEY, null);

  async function api(op, payload) {

    if (!cfg || !cfg.url || !cfg.key) throw new BridgeError("no_config");

      res = await fetch(cfg.url, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(Object.assign({ key: cfg.key, op }, payload || {})), redirect: "follow" });

    let data = null;
    try { data = await res.json(); } catch { throw new BridgeError("bad_response", "Скрипт відповів не JSON. Перевір, що адреса закінчується на /exec і доступ — «Anyone»."); }

    if (c === "offline") return "Немає інтернету або скрипт недоступний.";
    if (c === "bad_key") return "Ключ не збігається з APP_KEY у скрипті.";
    if (c === "no_token") return "У скрипті не задано NOTION_TOKEN.";
    if (m.startsWith("notion_unauthorized")) return "Notion не прийняв токен. Перевір NOTION_TOKEN у скрипті.";

    return "Помилка: " + m.slice(0, 200);

  async function load(manual) {
    if (state.loading) return;

      const data = await api("load");
      state.teas = (data.teas || []).map(teaFrom);
      state.log = (data.log || []).map(logFrom);
      state.settings = Object.fromEntries((data.settings || []).map((r) => [r["Параметр"], r["Значення"]]));
      state.loadedAt = Date.now(); state.fromCache = false;
      store.set(CACHE_KEY, { teas: state.teas, log: state.log, settings: state.settings, at: state.loadedAt });
      hideBanner();
      if (manual) toast("Полицю оновлено");
    } catch (err) {
      if (err.code === "offline") { state.fromCache = true; if (manual) toast("Немає зв'язку — показую збережену полицю"); }

  // ---------- offline queue: every change is stored locally first, then sent in order
  function enqueue(op, payload) {

        catch (err) {

  // ---------- writes (optimistic, queued)
  function addLog(tea, action, extra) {

  // ---------- new tea
  const OPTIONS = {

  let draft = null;
  function openAdd() {

  function renderAdd() {
    $("addHost").innerHTML = `<form class="addform" id="addForm" novalidate>
      <h2>Новий чай</h2>
      <fieldset><legend>Основне</legend><div class="fgrid">
        ${fld("f-name", "Назва", { wide: true, required: true, ph: "Напр. Лао Бань Чжан (老班章) 2019, 357 г" })}
        ${sel("f-cat", "Категорія")}${sel("f-format", "Формат")}${sel("f-region", "Регіон")}

  async function submitAdd() {

      "Вода": v("f-water"), "Промивка": v("f-rinse"), "Проливи": v("f-steeps"), "Кількість проливів": v("f-count"),
      "Скільки класти": v("f-dose"), "Пропорція": v("f-ratio"), "Коли пити": draft.when.slice(),

  // ---------- setup

  });
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible") return;
    if (tm && tm.running) tick();
    if (tm) keepAwake(true);
    if (!tm && !sheet && Date.now() - state.loadedAt > 5 * 60 * 1000) load(false);
  });
  $("refresh").addEventListener("click", () => load(true));
  $("settingsBtn").addEventListener("click", () => openSetup());
  $("addBtn").addEventListener("click", () => { if (!config()) openSetup(); else openAdd(); });
  window.addEventListener("online", () => { flushQueue().then(() => load(false)); });
  const cur = () => state.teas.find((t) => t.id === state.selected);
  setInterval(() => { if (!tm && !sheet && state.tab === "shelf") renderAdvice(currentDaypart()); }, 10 * 60 * 1000);

  // ---------- boot
  const snap = store.get(CACHE_KEY, null);
  if (snap && Array.isArray(snap.teas)) { state.teas = snap.teas; state.log = snap.log || []; state.settings = snap.settings || {}; state.loadedAt = snap.at || 0; state.fromCache = true; }
  state.queue = store.get(QUEUE_KEY, []);
  render();
  load(false);
  // Нова версія сайту: браузер перевіряє sw.js без HTTP-кешу, а щойно новий воркер бере керування — перезавантажуємо сторінку.
  if ("serviceWorker" in navigator) {
    const hadController = !!navigator.serviceWorker.controller;
    let reloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadController && !reloaded && !tm && !sheet) { reloaded = true; location.reload(); } });
    navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then((reg) => {
      reg.update().catch(() => {});
      document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") reg.update().catch(() => {}); });
    }).catch(() => {});
  }
})();
</script>
</body>
</html>
